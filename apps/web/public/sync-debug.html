<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sync Loop Debug</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #0f0;
            background: #0a0a0a;
        }
        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #0c0;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #0f0;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }
        .stat-box {
            background: #111;
            padding: 10px;
            border: 1px solid #050;
        }
        .error { color: #f00; }
        .warning { color: #ff0; }
        .success { color: #0f0; }
        h1 { color: #0f0; }
    </style>
</head>
<body>
    <h1>🔍 SYNC LOOP DEBUG CONSOLE</h1>
    
    <div class="section">
        <h2>📊 Real-time Stats</h2>
        <div class="stats">
            <div class="stat-box">
                <strong>Local Changes (Unprocessed)</strong>
                <div id="unprocessed">-</div>
            </div>
            <div class="stat-box">
                <strong>Local Changes (Processed)</strong>
                <div id="processed">-</div>
            </div>
            <div class="stat-box">
                <strong>Total Changes</strong>
                <div id="total">-</div>
            </div>
            <div class="stat-box">
                <strong>Sync State</strong>
                <div id="syncState">-</div>
            </div>
            <div class="stat-box">
                <strong>Current LSN</strong>
                <div id="currentLSN">-</div>
            </div>
            <div class="stat-box">
                <strong>Tracking Enabled</strong>
                <div id="trackingEnabled">-</div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>🧪 Test Controls</h2>
        <button onclick="clearAllChanges()">🗑️ Clear All Changes</button>
        <button onclick="createTestTask()">➕ Create Test Task</button>
        <button onclick="bulkCreateTasks(10)">📦 Create 10 Tasks</button>
        <button onclick="bulkCreateTasks(50)">📦 Create 50 Tasks</button>
        <button onclick="simulateIncomingSync()">📥 Simulate Incoming Sync</button>
        <button onclick="toggleTracking()">🔄 Toggle Tracking</button>
        <button onclick="refreshStats()">🔄 Refresh Stats</button>
    </div>

    <div class="section">
        <h2>📝 Hook Debug Log</h2>
        <div id="hookLog" class="log"></div>
    </div>

    <div class="section">
        <h2>📝 Sync Debug Log</h2>
        <div id="syncLog" class="log"></div>
    </div>

    <script type="module">
        // Store original console.log
        const originalLog = console.log;
        
        // Intercept console.log for specific patterns
        console.log = function(...args) {
            originalLog.apply(console, args);
            
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            
            // Capture hook debug messages
            if (message.includes('[Dexie Hook Debug]')) {
                addHookLog(message);
            }
            
            // Capture sync-related messages
            if (message.includes('[IncomingChangeService]') || 
                message.includes('[DexieOutgoingChangeService]') ||
                message.includes('[Dexie Change Tracking]') ||
                message.includes('SYNC_TRANSACTION')) {
                addSyncLog(message);
            }
        };

        function addHookLog(message) {
            const log = document.getElementById('hookLog');
            const entry = document.createElement('div');
            entry.textContent = new Date().toISOString().split('T')[1] + ' ' + message;
            
            // Color coding
            if (message.includes('🚨')) entry.className = 'error';
            else if (message.includes('✅')) entry.className = 'success';
            else if (message.includes('⚠️')) entry.className = 'warning';
            
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 100 entries
            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        function addSyncLog(message) {
            const log = document.getElementById('syncLog');
            const entry = document.createElement('div');
            entry.textContent = new Date().toISOString().split('T')[1] + ' ' + message;
            
            if (message.includes('ERROR') || message.includes('🚨')) entry.className = 'error';
            else if (message.includes('✅')) entry.className = 'success';
            
            log.insertBefore(entry, log.firstChild);
            
            // Keep only last 100 entries
            while (log.children.length > 100) {
                log.removeChild(log.lastChild);
            }
        }

        // Global functions for buttons
        window.clearAllChanges = async function() {
            const { db } = await import('/src/domain/index.js');
            await db.localChanges.clear();
            addSyncLog('✅ Cleared all local changes');
            refreshStats();
        };

        window.createTestTask = async function() {
            const { domainServices } = await import('/src/domain/index.js');
            const task = await domainServices.task.create({
                title: `Debug Task ${Date.now()}`,
                description: 'Created from debug console',
                status: 'todo'
            });
            addSyncLog(`✅ Created task: ${task.id}`);
            refreshStats();
        };

        window.bulkCreateTasks = async function(count) {
            const { domainServices } = await import('/src/domain/index.js');
            addSyncLog(`Creating ${count} tasks...`);
            
            for (let i = 0; i < count; i++) {
                await domainServices.task.create({
                    title: `Bulk Task ${i + 1} - ${Date.now()}`,
                    description: `Bulk created #${i + 1}`,
                    status: 'todo'
                });
            }
            
            addSyncLog(`✅ Created ${count} tasks`);
            refreshStats();
        };

        window.simulateIncomingSync = async function() {
            addSyncLog('🔄 Simulating incoming sync with SYNC_TRANSACTION flag...');
            
            const { db } = await import('@repo/dataforge/dexie-schema');
            const { SYNC_TRANSACTION } = await import('/src/db/dexie-change-tracking.js');
            
            // Create test data
            const testTasks = [];
            for (let i = 0; i < 5; i++) {
                testTasks.push({
                    id: crypto.randomUUID(),
                    title: `Sync Test ${i + 1}`,
                    description: 'Simulated sync data',
                    status: 'todo',
                    priority: 'medium',
                    createdAt: new Date(),
                    updatedAt: new Date()
                });
            }
            
            // Test 1: bulkPut with SYNC_TRANSACTION
            addSyncLog('Test 1: Using bulkPut with SYNC_TRANSACTION...');
            await db.transaction('rw', db.tasks, async (trans) => {
                trans[SYNC_TRANSACTION] = true;
                addSyncLog(`Transaction SYNC_TRANSACTION flag: ${!!trans[SYNC_TRANSACTION]}`);
                await db.tasks.bulkPut(testTasks);
            });
            
            addSyncLog('✅ Simulated incoming sync complete');
            setTimeout(refreshStats, 1000);
        };

        window.toggleTracking = async function() {
            const tracking = await import('/src/db/dexie-change-tracking.js');
            
            // Check current state by trying to get the module
            const currentState = document.getElementById('trackingEnabled').textContent === 'true';
            
            if (currentState) {
                tracking.disableChangeTracking();
                addSyncLog('🔴 Change tracking DISABLED');
            } else {
                tracking.enableChangeTracking();
                addSyncLog('🟢 Change tracking ENABLED');
            }
            
            refreshStats();
        };

        window.refreshStats = async function() {
            const { db } = await import('/src/domain/index.js');
            
            // Get change counts
            const unprocessed = await db.localChanges.where('processedSync').equals(0).count();
            const processed = await db.localChanges.where('processedSync').equals(1).count();
            const total = await db.localChanges.count();
            
            // Get sync state
            const syncState = localStorage.getItem('sync-machine-state');
            const syncData = syncState ? JSON.parse(syncState) : {};
            
            // Update UI
            document.getElementById('unprocessed').textContent = unprocessed;
            document.getElementById('processed').textContent = processed;
            document.getElementById('total').textContent = total;
            document.getElementById('syncState').textContent = syncData.value || 'unknown';
            document.getElementById('currentLSN').textContent = syncData.context?.currentLSN || 'none';
            
            // Check tracking state (this is a bit hacky but works for debugging)
            try {
                const { getAllChanges } = await import('/src/db/dexie-change-tracking.js');
                // If we can import it, tracking module is loaded
                document.getElementById('trackingEnabled').textContent = 'true';
            } catch {
                document.getElementById('trackingEnabled').textContent = 'unknown';
            }
        };

        // Auto-refresh stats every 2 seconds
        setInterval(refreshStats, 2000);
        
        // Initial load
        refreshStats();
        
        addSyncLog('🚀 Sync Debug Console Ready');
        addHookLog('👀 Monitoring Dexie hooks...');
    </script>
</body>
</html>
