<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Vibestack Web</title>
    <meta name="title" content="Vibestack Web" />
    <meta
      name="description"
      content="Local First, Sync Enabled Business Tool Platform"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vibestack-web.netlify.app" />
    <meta property="og:title" content="Vibestack Web" />
    <meta
      property="og:description"
      content="Local First, Sync Enabled Business Tool Platform"
    />
    <meta
      property="og:image"
      content="https://vibestack-web.netlify.app/images/vibestack-web.png"
    />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://vibestack-web.netlify.app" />
    <meta property="twitter:title" content="Vibestack Web" />
    <meta
      property="twitter:description"
      content="Local First, Sync Enabled Business Tool Platform"
    />
    <meta
      property="twitter:image"
      content="https://vibestack-web.netlify.app/images/vibestack-web.png"
    />

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <meta name="theme-color" content="#fff" />
  </head>

  <body class="group/body">
    <div id="root">
      <!-- Initial loading screen shown until React renders -->
      <style>
        .initial-loader {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: white;
          z-index: 9999;
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader {
            background: #0a0a0b;
          }
        }
        .initial-loader-content {
          text-align: center;
          padding: 2rem;
        }
        .initial-loader-spinner {
          width: 3rem;
          height: 3rem;
          margin: 0 auto 1.5rem;
          border: 3px solid rgba(0, 0, 0, 0.1);
          border-top-color: #3b82f6;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader-spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #3b82f6;
          }
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
        .initial-loader-title {
          font-size: 1.25rem;
          font-weight: 600;
          margin-bottom: 0.5rem;
          color: #111827;
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader-title {
            color: #f9fafb;
          }
        }
        .initial-loader-message {
          font-size: 0.875rem;
          color: #6b7280;
        }
        @media (prefers-color-scheme: dark) {
          .initial-loader-message {
            color: #9ca3af;
          }
        }
      </style>
      <div class="initial-loader">
        <div class="initial-loader-content">
          <div class="initial-loader-spinner"></div>
          <div class="initial-loader-title">VibeStack</div>
          <div class="initial-loader-message">Loading application...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
