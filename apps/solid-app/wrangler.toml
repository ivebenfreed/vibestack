name = "solid-app"
main = ".output/server/index.mjs"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Static assets configuration for Workers
[site]
bucket = ".output/public"

# Or use the newer experimental assets binding (choose one)
# [experimental_assets]
# directory = ".output/public"
# binding = "ASSETS"

# Environment variables (use wrangler secret for sensitive values)
[vars]
NODE_ENV = "production"

# Build configuration
[build]
command = "pnpm build"

# Development server configuration
[dev]
port = 8788

# KV Namespaces (if needed)
# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-namespace-id"

# Durable Objects (if needed)
# [[durable_objects.bindings]]
# name = "DO"
# class_name = "DurableObject"
# script_name = "solid-app"

# R2 Buckets (if needed)
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "your-bucket-name"

# D1 Database (if needed)
# [[d1_databases]]
# binding = "DB"
# database_name = "your-database-name"
# database_id = "your-database-id"