<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --primary-50: #f0f9ff;
            --primary-100: #e0f2fe;
            --primary-500: #0ea5e9;
        }
        .test-gradient {
            background: linear-gradient(135deg, var(--primary-50) 0%, var(--primary-100) 100%);
            width: 400px;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .test-box {
            background: var(--primary-500);
            color: white;
            padding: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="test-gradient">
        <div class="test-box">This should be blue on gradient background</div>
    </div>
</body>
</html>
