name = "vibestack-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Enable observability logging for all environments
[observability.logs]
enabled = true

# Development server configuration
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
upstream_protocol = "http"
host = "127.0.0.1"
# cert = "./server.pem"
# key = "./server-key.pem"

# Environment variables
[vars]
ENVIRONMENT = "development"

# Module aliases (correct syntax)
[alias]
"debug" = "./src/shims/debug.ts"
"app-root-path" = "./src/lib/app-root-path-shim.ts"

# Specify ESM format
[build]
command = ""
watch_dir = "src"

# Durable Objects configuration
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

# Durable Objects migrations (for free plan compatibility)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncDO", "ReplicationDO"]

# Cron triggers
[triggers]
crons = ["* * * * *"]  # Run every minute to keep replication DO alive

# KV namespace configuration
[[kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "preview"
preview_id = "preview"

# Staging environment
[env.staging]
name = "vibestack-server-staging"

# Backend is accessed internally via workers.dev URL
# No custom domain needed

# Durable Objects configuration for staging
[[env.staging.durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[env.staging.durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[env.staging.vars]
ENVIRONMENT = "staging"
NODE_ENV = "staging"
TYPEORM_LOGGING = true

[[env.staging.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "68f6c70b38ff4f1a85a057868cfd11cb"

# Production environment
[env.production]
name = "vibestack-server-production"

# Backend is accessed internally via workers.dev URL
# No custom domain needed

# Durable Objects configuration for production
[[env.production.durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[env.production.durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[env.production.vars]
ENVIRONMENT = "production"
NODE_ENV = "production"
TYPEORM_LOGGING = false

[[env.production.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "68f6c70b38ff4f1a85a057868cfd11cb"
