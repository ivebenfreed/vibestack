name = "vibestack-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "c5f1240efb99747bc33b0fa1f70dcfb3"

# Enable observability logging for all environments
[observability.logs]
enabled = true

# Development server configuration
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
upstream_protocol = "http"
host = "127.0.0.1"
# cert = "./server.pem"
# key = "./server-key.pem"

# Environment variables
[vars]
ENVIRONMENT = "development"
# DATABASE_URL should be set in .env file, not here
BETTER_AUTH_SECRET = "NXlg2n5ouDPKtoHHOvUvc8pcQztoW8bpIN5B+jdC3Yk="
BETTER_AUTH_URL = "http://localhost:5173"
RESEND_API_KEY = "re_jdbsLnkN_45KiUYXRGskuFXE7Gth6wqM6"

# Module aliases (correct syntax)
[alias]
"debug" = "./src/shims/debug.ts"
"app-root-path" = "./src/lib/app-root-path-shim.ts"
"pg" = "./src/shims/pg.ts"

# Specify ESM format
[build]
command = ""
watch_dir = "src"

# External modules to exclude from bundling
[bundling]
external = ["pg"]

# Durable Objects configuration
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[[durable_objects.bindings]]
name = "ORG_SCHEMA"
class_name = "OrgSchemaDO"

[[durable_objects.bindings]]
name = "SUPER_ADMIN"
class_name = "SuperAdminDO"

[[durable_objects.bindings]]
name = "ORG_ADMIN"
class_name = "OrgAdminDO"

[[durable_objects.bindings]]
name = "ORG_OPS"
class_name = "OrgOpsDO"

# Durable Objects migrations (for free plan compatibility)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncDO", "ReplicationDO", "OrgSchemaDO", "SuperAdminDO", "OrgAdminDO", "OrgOpsDO"]

# Cron triggers
[triggers]
crons = ["0 0 * * *"]  # Run once daily at midnight UTC

# KV namespace configuration
# Development uses a local namespace
[[kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "a794cee3a313416993643848fc738281"
preview_id = "a794cee3a313416993643848fc738281"

# Staging environment
[env.staging]
name = "vibestack-server-staging"

# Backend is accessed internally via workers.dev URL
# No custom domain needed

# Durable Objects configuration for staging
[[env.staging.durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[env.staging.durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[[env.staging.durable_objects.bindings]]
name = "ORG_SCHEMA"
class_name = "OrgSchemaDO"

[[env.staging.durable_objects.bindings]]
name = "SUPER_ADMIN"
class_name = "SuperAdminDO"

[[env.staging.durable_objects.bindings]]
name = "ORG_ADMIN"
class_name = "OrgAdminDO"

[[env.staging.durable_objects.bindings]]
name = "ORG_OPS"
class_name = "OrgOpsDO"

[env.staging.vars]
ENVIRONMENT = "staging"
NODE_ENV = "staging"
TYPEORM_LOGGING = true

[[env.staging.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "a794cee3a313416993643848fc738281"

# Production environment
[env.production]
name = "vibestack-server-production"

# Backend is accessed internally via workers.dev URL
# No custom domain needed

# Durable Objects configuration for production
[[env.production.durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[env.production.durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[[env.production.durable_objects.bindings]]
name = "ORG_SCHEMA"
class_name = "OrgSchemaDO"

[[env.production.durable_objects.bindings]]
name = "SUPER_ADMIN"
class_name = "SuperAdminDO"

[[env.production.durable_objects.bindings]]
name = "ORG_ADMIN"
class_name = "OrgAdminDO"

[[env.production.durable_objects.bindings]]
name = "ORG_OPS"
class_name = "OrgOpsDO"

[env.production.vars]
ENVIRONMENT = "production"
NODE_ENV = "production"
TYPEORM_LOGGING = false

[[env.production.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "a794cee3a313416993643848fc738281"
