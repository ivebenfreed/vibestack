<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Dashboard Test</title>
    <style>
        body { 
            font-family: monospace; 
            margin: 20px; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
        }
        .console { 
            background: #000; 
            padding: 20px; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            font-size: 14px;
            min-height: 400px;
            overflow-y: auto;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #005999; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
        .warning { color: #ff9800; }
    </style>
</head>
<body>
    <h1>🧪 Dynamic Dashboard Test</h1>
    <p>Testing the new dynamic dashboard with Wide Corp organization data</p>
    
    <button onclick="openDashboard()">📊 Open Dashboard</button>
    <button onclick="testSchema()">🔍 Test Schema</button>
    <button onclick="testLiveStore()">🔗 Test LiveStore</button>
    <button onclick="runFullTest()">🚀 Run Full Test</button>
    <button onclick="clearConsole()">🧹 Clear</button>
    
    <div id="console" class="console"></div>

    <script>
        const WIDE_CORP_ORG_ID = '01920000-1000-7000-8000-000000000001';
        
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : 
                             type === 'error' ? 'error' : 
                             type === 'warning' ? 'warning' : 'info';
            console.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            console.scrollTop = console.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }
        
        function openDashboard() {
            log('🌐 Opening dashboard in new tab...', 'info');
            const dashboardUrl = 'http://localhost:5173/#/';
            window.open(dashboardUrl, '_blank');
        }
        
        async function testSchema() {
            log('🔍 Testing schema API...', 'info');
            try {
                const response = await fetch(`http://localhost:8787/api/archetype/orgs/${WIDE_CORP_ORG_ID}/schema`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success && data.schema) {
                    const entities = Object.keys(data.schema.entities);
                    log(`✅ Schema loaded: ${entities.length} entities`, 'success');
                    entities.forEach(entity => {
                        const tableName = data.schema.entities[entity].tableName;
                        log(`   - ${entity} (${tableName})`, 'info');
                    });
                } else {
                    log(`❌ Schema loading failed: ${data.error}`, 'error');
                }
            } catch (error) {
                log(`❌ Error loading schema: ${error.message}`, 'error');
            }
        }
        
        async function testLiveStore() {
            log('🔗 Testing LiveStore connectivity...', 'info');
            log('⚠️ LiveStore can only be tested from within the main app context', 'warning');
            log('📋 To test LiveStore:', 'info');
            log('   1. Open the dashboard', 'info');
            log('   2. Open browser console', 'info');
            log('   3. Run: window.testDynamicDashboard()', 'info');
        }
        
        async function runFullTest() {
            clearConsole();
            log('🚀 Starting Dynamic Dashboard Tests...', 'info');
            log('', 'info');
            
            // Test 1: Schema API
            await testSchema();
            log('', 'info');
            
            // Test 2: LiveStore (instructions only)
            await testLiveStore();
            log('', 'info');
            
            log('🎯 Schema test completed. Open dashboard to test LiveStore integration.', 'success');
        }
        
        // Auto-run on page load
        log('🧪 Dynamic Dashboard Test Console Ready', 'success');
        log('Click "Run Full Test" to begin testing', 'info');
        log('', 'info');
    </script>
</body>
</html>
