<!DOCTYPE html>
<html>
<head>
    <title>Test Optimized Tracking Control</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #0f0;
        }
        .log {
            background: #000;
            padding: 10px;
            margin: 10px 0;
            max-height: 600px;
            overflow-y: auto;
            border: 1px solid #0f0;
        }
        .success { color: #0f0; font-weight: bold; }
        .error { color: #f00; font-weight: bold; }
        .tracking-disabled { color: #f00; }
        .tracking-enabled { color: #0f0; }
    </style>
</head>
<body>
    <h1>🔍 Optimized Tracking Control Test</h1>
    <p>This test verifies that change tracking is controlled at the sync phase level</p>
    
    <div id="log" class="log">
        <div>Starting test...</div>
    </div>
    
    <script type="module">
        const log = document.getElementById('log');
        
        function addLog(message, className = '') {
            const entry = document.createElement('div');
            entry.textContent = new Date().toISOString().split('T')[1].substring(0, 12) + ' ' + message;
            if (className) entry.className = className;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        // Intercept console.log to capture tracking messages
        const originalLog = console.log;
        console.log = function(...args) {
            originalLog.apply(console, args);
            
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : arg
            ).join(' ');
            
            // Capture tracking control messages
            if (message.includes('DISABLING change tracking for ENTIRE')) {
                addLog('🔴 ' + message, 'tracking-disabled');
            } else if (message.includes('RE-ENABLING change tracking after')) {
                addLog('🟢 ' + message, 'tracking-enabled');
            } else if (message.includes('[SyncMachineV3]') && message.includes('tracking')) {
                addLog(message, message.includes('DISABLING') ? 'tracking-disabled' : 'tracking-enabled');
            }
            
            // Capture IncomingChangeService messages
            if (message.includes('[IncomingChangeService]') && 
                (message.includes('Change tracking') || message.includes('Bulk'))) {
                // Check if it mentions toggle operations (should NOT happen anymore)
                if (message.includes('DISABLED for bulk') || message.includes('RE-ENABLED after bulk')) {
                    addLog('❌ REDUNDANT TOGGLE DETECTED: ' + message, 'error');
                } else {
                    addLog(message);
                }
            }
        };
        
        addLog('Test initialized. Monitoring console output...');
        addLog('Navigate to the main app in another tab to trigger sync and see results here.');
        
        // Set up a test to check tracking state
        setTimeout(async () => {
            addLog('');
            addLog('=== EXPECTED BEHAVIOR ===', 'success');
            addLog('1. Initial app load: Tracking ENABLED by default');
            addLog('2. Initial sync starts: Single DISABLE at phase start');
            addLog('3. During initial sync: NO individual toggle operations');
            addLog('4. Initial sync ends: Single RE-ENABLE at phase end');
            addLog('5. Live sync: Tracking stays ENABLED');
            addLog('');
            addLog('✅ If you see only TWO tracking messages (disable/enable) = SUCCESS', 'success');
            addLog('❌ If you see MANY tracking messages = PROBLEM', 'error');
        }, 2000);
    </script>
</body>
</html>
