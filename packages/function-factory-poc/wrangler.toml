name = "function-factory-poc"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Development server
[dev]
ip = "127.0.0.1"
port = 8788
local_protocol = "http"

# Environment variables
[vars]
ENVIRONMENT = "poc"

# KV namespaces for Function Factory
[[kv_namespaces]]
binding = "ENTITY_FUNCTIONS"
id = "entity-functions-poc"
preview_id = "entity-functions-poc"

[[kv_namespaces]]
binding = "ENTITY_SCHEMAS"
id = "entity-schemas-poc"
preview_id = "entity-schemas-poc"

[[kv_namespaces]]
binding = "ENTITY_CONFIG"
id = "entity-config-poc"
preview_id = "entity-config-poc"

# D1 Database for real persistence
[[d1_databases]]
binding = "DB"
database_name = "function-factory-poc"
database_id = "function-factory-poc"

# Durable Objects for per-org and per-entity isolation
[[durable_objects.bindings]]
name = "ORG_OBJECTS"
class_name = "OrganizationDurableObject"

[[durable_objects.bindings]]
name = "ENTITY_OBJECTS"
class_name = "EntityDurableObject"

[[durable_objects.bindings]]
name = "ROUTER_OBJECTS"
class_name = "SmartRoutingDurableObject"

# Export Durable Object classes
[[migrations]]
tag = "v1"
new_classes = ["OrganizationDurableObject", "EntityDurableObject", "SmartRoutingDurableObject"]