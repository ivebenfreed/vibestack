name = "vibestack-server"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

# Enable observability logging for all environments
[observability.logs]
enabled = true

# Development server configuration
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
upstream_protocol = "http"
host = "127.0.0.1"

# Local environment configuration
[env.local]

# Environment variables
[env.local.vars]
ENVIRONMENT = "local"
# Port values will come from .env.local (auto-generated by setup-dev-ports.js)
# Database URLs will also come from .env.local with dynamic ports

# KV Namespace for client registry (FIXED BINDING NAME)
[[env.local.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "01453e5dc2ff4cf8a061a25b95501df0"

# Durable Objects
[[env.local.durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[env.local.durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

# Durable Objects migrations
[[env.local.migrations]]
tag = "v1"
new_classes = ["SyncDO", "ReplicationDO"]

# Module aliases (correct syntax)
[alias]
"debug" = "./src/shims/debug.ts"
"app-root-path" = "./src/lib/app-root-path-shim.ts"
"pg" = "./src/shims/pg.ts"

# Enable unlimited Workers for testing
[limits]
cpu_ms = 10_000