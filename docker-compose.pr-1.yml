services:
  postgres:
    container_name: vibestack-postgres-1
    build:
      context: .
      dockerfile: Dockerfile.postgres
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c max_logical_replication_workers=3
      -c log_statement=all
      -c log_replication_commands=on
      -c logging_collector=on
      -c log_destination=stderr
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5442:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibestack_dev_issue_1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: vibestack-neon-proxy-1
    environment:
      - PG_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/vibestack_dev_issue_1?sslmode=disable
    ports:
      - "4454:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: