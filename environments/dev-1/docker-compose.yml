services:
  # PostgreSQL database
  postgres:
    image: postgres:17
    container_name: vibestack-dev1-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibestack_dev
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # dev-1 uses 5433
    networks:
      - dev1
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB

  # Chrome for testing
  chrome:
    image: browserless/chrome:latest
    container_name: vibestack-dev1-chrome
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
    ports:
      - "3001:3000"  # dev-1 uses 3001
      - "9223:9222"   
    shm_size: 1gb
    networks:
      - dev1

  # Development environment - NO MOUNTING, will clone git repo inside
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibestack-dev1
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vibestack_dev
      - PNPM_HOME=/home/developer/.local/share/pnpm
      - PATH=/home/developer/.local/share/pnpm:/home/developer/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      # Git repo to clone
      - GIT_REPO_URL=https://github.com/vibestack/vibestack.git
      - GIT_BRANCH=staging
    ports:
      - "5175:5173"  # dev-1 uses 5175 for web
      - "8789:8787"  # dev-1 uses 8789 for api  
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev1
    stdin_open: true
    tty: true
    user: "1000:1000"

networks:
  dev1:
    driver: bridge

volumes:
  postgres_data:
    name: vibestack-dev1-postgres-data