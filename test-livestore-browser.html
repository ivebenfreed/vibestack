<!DOCTYPE html>
<html>
<head>
    <title>LiveStore Browser Test</title>
</head>
<body>
    <h1>LiveStore Browser Test</h1>
    <div id="output"></div>
    
    <script>
        // Simple test to check if LiveStore is working in the browser
        async function testLiveStore() {
            const output = document.getElementById('output');
            output.innerHTML += '<p>🧪 Testing LiveStore initialization...</p>';
            
            try {
                // Navigate to the app
                window.location.href = 'http://localhost:5173';
                
            } catch (error) {
                output.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        // Wait for page load then test
        window.addEventListener('load', () => {
            setTimeout(testLiveStore, 1000);
        });
    </script>
</body>
</html>
