version: '3.8'

services:
  vibestack-dev:
    image: ubuntu:24.04
    container_name: vibestack-dev-env
    hostname: vibestack-dev
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - vibestack-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "2225:22"
      - "5175:5173" 
      - "8789:8787"
      - "5434:5432"
    environment:
      - DEBIAN_FRONTEND=noninteractive
    command: |
      bash -c "
        # Install systemd and basic tools
        apt update && apt install -y systemd systemd-sysv
        
        # Install development tools
        apt install -y curl wget git tmux nano htop build-essential
        apt install -y nodejs npm python3 python3-pip postgresql-client
        apt install -y openssh-server sudo
        
        # Install Docker CLI
        apt install -y docker.io
        
        # Install pnpm
        npm install -g pnpm@9.15.1
        
        # Create developer user
        useradd -m -s /bin/bash -G sudo developer
        echo 'developer:developer' | chpasswd
        echo 'developer ALL=(ALL) NOPASSWD:ALL' >> /etc/sudoers
        
        # Configure SSH
        mkdir -p /var/run/sshd
        sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /etc/ssh/sshd_config
        sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        
        # Install XFCE (optional - can access via VNC)
        apt install -y xfce4 xfce4-terminal firefox-esr
        apt install -y xrdp
        systemctl enable xrdp
        
        # Install Claude Code for developer user
        su - developer -c 'curl -fsSL https://claude.ai/install.sh | sh'
        
        # Create workspace
        mkdir -p /workspace
        chown developer:developer /workspace
        
        # Start services
        systemctl enable ssh
        service ssh start
        service xrdp start
        
        echo '✅ Development environment ready!'
        echo 'SSH: ssh -p 2222 developer@localhost'
        echo 'RDP: Connect to localhost:3389 for desktop'
        
        # Keep container running
        exec /lib/systemd/systemd
      "
    restart: unless-stopped

volumes:
  vibestack-workspace: