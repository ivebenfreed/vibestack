services:
  # PostgreSQL database
  postgres:
    image: postgres:17
    container_name: vibestack-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibestack_dev
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    networks:
      - vibestack
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c max_connections=200
      -c shared_buffers=256MB

  # Chrome for testing
  chrome:
    image: browserless/chrome:latest
    container_name: vibestack-chrome
    environment:
      - MAX_CONCURRENT_SESSIONS=10
      - CONNECTION_TIMEOUT=60000
    ports:
      - "3001:3000"  # Different port to avoid conflicts
      - "9223:9222"  # Different port for debugging
    shm_size: 1gb
    networks:
      - vibestack

  # Development environment
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibestack-dev
    volumes:
      - ..:/workspace:delegated  # Mount parent directory (vibestack root) as workspace
      - node_modules_cache:/workspace/node_modules
      - pnpm_cache:/home/developer/.local/share/pnpm
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/vibestack_dev
      - PNPM_HOME=/home/developer/.local/share/pnpm
      - PATH=/home/developer/.local/share/pnpm:/home/developer/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    ports:
      - "5175:5173"  # Web app
      - "8789:8787"  # API server
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vibestack
    stdin_open: true
    tty: true
    user: "1000:1000"  # Run as developer user

networks:
  vibestack:
    driver: bridge

volumes:
  postgres_data:
    name: vibestack-postgres-data
  node_modules_cache:
    name: vibestack-node-modules-cache
  pnpm_cache:
    name: vibestack-pnpm-cache