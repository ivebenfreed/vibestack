version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: vibestack-postgres
    command: '-d 1'  # Enable debug logging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibestack_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    container_name: vibestack-neon-proxy
    environment:
      - PG_CONNECTION_STRING=postgres://postgres:postgres@postgres:5432/vibestack_dev
    ports:
      - "4444:4444"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: