# Production KV namespaces
[[env.staging.kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "a794cee3a313416993643848fc738281"
preview_id = "a794cee3a313416993643848fc738281"

[[env.staging.kv_namespaces]]
binding = "SESSIONS"
id = "b35f1142406543d79f9445f1af5c6abc"
preview_id = "b35f1142406543d79f9445f1af5c6abc"

# Production hyperdrive configuration
[[env.staging.hyperdrive]]
binding = "HYPERDRIVE_DB"
