name = "elevra-worker"
main = "worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat", "do_not_set_tostring_tag"]
account_id = "c5f1240efb99747bc33b0fa1f70dcfb3"

# Enable observability logging for all environments
[observability.logs]
enabled = true

# Assets binding for serving the Vite-built SPA
[assets]
binding = "ASSETS"
directory = "./dist/client"
not_found_handling = "single-page-application"

# Environment variables
[vars]
ENVIRONMENT = "development"
BETTER_AUTH_SECRET = "NXlg2n5ouDPKtoHHOvUvc8pcQztoW8bpIN5B+jdC3Yk="
BETTER_AUTH_URL = "http://localhost:5173"
RESEND_API_KEY = "re_jdbsLnkN_45KiUYXRGskuFXE7Gth6wqM6"
USE_KV_SESSIONS = true

# AI binding for Cloudflare AI/Workers AI
[ai]
binding = "AI"

# Durable Objects configuration
[[durable_objects.bindings]]
name = "SYNC"
class_name = "SyncDO"

[[durable_objects.bindings]]
name = "REPLICATION"
class_name = "ReplicationDO"

[[durable_objects.bindings]]
name = "ORGANIZATION_ACTOR"
class_name = "OrganizationActor"

[[durable_objects.bindings]]
name = "EMBEDDING_GENERATOR"
class_name = "EmbeddingGeneratorDO"



# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncDO", "ReplicationDO", "OrganizationActor"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["EmbeddingGeneratorDO"]



# Cron triggers
[triggers]
crons = ["0 0 * * *"]  # Run once daily at midnight UTC

# Rate limiting configuration - temporarily disabled for CI compatibility
# [[ratelimits]]
# name = "auth_rate_limit"
# namespace_id = "placeholder-namespace-id"
# simple = { limit = 5, period = 60 }  # Changed from 900 to 60

# [[ratelimits]]
# name = "api_rate_limit" 
# namespace_id = "placeholder-namespace-id"
# simple = { limit = 10000, period = 60 }

# [[ratelimits]]
# name = "signup_rate_limit"
# namespace_id = "placeholder-namespace-id"
# simple = { limit = 3, period = 60 }  # Changed from 3600 to 60

# Hyperdrive configuration for PostgreSQL connection pooling
[[hyperdrive]]
binding = "HYPERDRIVE_DB"
id = "placeholder-hyperdrive-id"  # Used for local development only
localConnectionString = "postgresql://postgres:postgres@localhost:5432/elevra_dev"

# KV namespace configuration
[[kv_namespaces]]
binding = "CLIENT_REGISTRY"
id = "a794cee3a313416993643848fc738281"
preview_id = "a794cee3a313416993643848fc738281"

[[kv_namespaces]]
binding = "SESSIONS"
id = "b35f1142406543d79f9445f1af5c6abc"
preview_id = "b35f1142406543d79f9445f1af5c6abc"

# Production environment (using staging slot)
[env.staging]
name = "elevra-worker-staging"

# Custom domain routes
[[env.staging.routes]]
pattern = "dev.getelevra.com/*"
zone_name = "getelevra.com"

[env.staging.vars]
ENVIRONMENT = "production"
NODE_ENV = "production"
TYPEORM_LOGGING = false
BETTER_AUTH_SECRET = "NXlg2n5ouDPKtoHHOvUvc8pcQztoW8bpIN5B+jdC3Yk="
BETTER_AUTH_URL = "https://dev.getelevra.com"
RESEND_API_KEY = "re_jdbsLnkN_45KiUYXRGskuFXE7Gth6wqM6"
USE_KV_SESSIONS = true

# Production AI binding
[env.staging.ai]
binding = "AI"

# Production Durable Objects configuration
[[env.staging.durable_objects.bindings]]
