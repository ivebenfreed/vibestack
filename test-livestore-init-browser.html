<!DOCTYPE html>
<html>
<head>
    <title>LiveStore Initialization Debug</title>
    <style>
        body { 
            font-family: monospace; 
            margin: 20px; 
            background-color: #1a1a1a; 
            color: #e0e0e0; 
        }
        .console { 
            background: #000; 
            padding: 20px; 
            border-radius: 8px; 
            white-space: pre-wrap; 
            font-size: 14px;
            min-height: 600px;
            overflow-y: auto;
        }
        button {
            background: #007acc;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
        }
        button:hover { background: #005999; }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .info { color: #2196f3; }
        .warning { color: #ff9800; }
        .event { color: #9c27b0; }
    </style>
</head>
<body>
    <h1>🧪 LiveStore Initialization Debug</h1>
    <p>Debug the LiveStore initialization sequence and check why entities aren't showing</p>
    
    <button onclick="openMainApp()">🌐 Open Main App</button>
    <button onclick="runLiveStoreTest()">🔧 Run LiveStore Test</button>
    <button onclick="checkAuthState()">🔐 Check Auth</button>
    <button onclick="checkMachineStates()">🤖 Check Machines</button>
    <button onclick="triggerEvents()">📡 Trigger Events</button>
    <button onclick="clearConsole()">🧹 Clear</button>
    
    <div id="console" class="console"></div>

    <script>
        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'success' ? 'success' : 
                             type === 'error' ? 'error' : 
                             type === 'warning' ? 'warning' : 
                             type === 'event' ? 'event' : 'info';
            console.innerHTML += `<span class="${className}">[${timestamp}] ${message}</span>\n`;
            console.scrollTop = console.scrollHeight;
        }
        
        function clearConsole() {
            document.getElementById('console').innerHTML = '';
        }
        
        function openMainApp() {
            log('🌐 Opening main app in new tab...', 'info');
            window.open('http://localhost:5173/', '_blank');
        }
        
        function runLiveStoreTest() {
            clearConsole();
            log('🚀 Running LiveStore initialization test...', 'info');
            log('⚠️ This test needs to run in the main app context', 'warning');
            log('📋 Instructions:', 'info');
            log('1. Open the main app', 'info');
            log('2. Login with ceo@widecorp.com / WideCorp2024!CEO', 'info');
            log('3. Open browser console', 'info');
            log('4. Paste and run the test script:', 'info');
            log('', 'info');
            
            // Show the test script to copy-paste
            const testScript = `
// LiveStore Debug Test Script
console.log('🧪 Testing LiveStore initialization...');

// Check auth state
const authState = JSON.parse(localStorage.getItem('vibestack-auth-state') || '{}');
const lastOrgId = localStorage.getItem('vibestack-last-organization-id');
console.log('🔐 Auth state:', authState);
console.log('🏢 Last org ID:', lastOrgId);

// Check machines
const authActor = window.authMachineActor;
const appInitActor = window.appInitActor;

if (authActor) {
  const authSnapshot = authActor.getSnapshot();
  console.log('🤖 Auth machine state:', authSnapshot.value);
  console.log('👤 User:', authSnapshot.context.user?.email || 'none');
  console.log('🏢 Organization:', authSnapshot.context.currentOrganization?.name || 'none');
} else {
  console.log('❌ Auth machine not available');
}

if (appInitActor) {
  const snapshot = appInitActor.getSnapshot();
  console.log('🚀 App init state:', snapshot.value);
  console.log('📊 Context:', {
    isDatabaseInitialized: snapshot.context.isDatabaseInitialized,
    isLiveStoreReady: snapshot.context.isLiveStoreReady,
    organizationId: snapshot.context.organizationId
  });
} else {
  console.log('❌ App init machine not available');
}

// Check LiveStore
const globalLiveStore = window.globalLiveStore || window.LiveStore;
if (globalLiveStore) {
  console.log('✅ LiveStore found:', globalLiveStore);
  
  // Test a simple query
  globalLiveStore.query("SELECT name FROM sqlite_master WHERE type='table'")
    .then(tables => {
      console.log('📊 LiveStore tables:', tables.length);
      const orgTables = tables.filter(t => t.name.includes('01920000'));
      console.log('🏢 Organization tables:', orgTables.length);
      orgTables.forEach(t => console.log('  -', t.name));
    })
    .catch(err => console.error('❌ LiveStore query failed:', err));
} else {
  console.log('❌ LiveStore not found');
}

// Set up event listeners
const events = ['database:check', 'database:ready', 'livestore:ready', 'livestore:error'];
events.forEach(event => {
  window.addEventListener(event, (e) => {
    console.log('🎉 Event:', event, e.detail || '');
  });
});

// Trigger database check
console.log('🔄 Triggering database check...');
window.dispatchEvent(new CustomEvent('database:check'));

console.log('✅ Debug test complete - check logs above');
            `.trim();
            
            log('Copy and paste this script in the browser console:', 'info');
            log('', 'info');
            log(testScript, 'info');
            log('', 'info');
            log('✅ Script ready to copy', 'success');
        }
        
        function checkAuthState() {
            log('🔍 Checking auth state (cross-origin limited)...', 'info');
            log('⚠️ Due to cross-origin restrictions, auth check must be done in main app', 'warning');
            log('📋 To check auth state:', 'info');
            log('1. Open main app', 'info');
            log('2. In console run: JSON.parse(localStorage.getItem("vibestack-auth-state"))', 'info');
        }
        
        function checkMachineStates() {
            log('🤖 Checking machine states...', 'info');
            log('⚠️ XState machines only available in main app context', 'warning');
            log('📋 To check machine states in main app console:', 'info');
            log('console.log("Auth:", window.authMachineActor?.getSnapshot())', 'info');
            log('console.log("AppInit:", window.appInitActor?.getSnapshot())', 'info');
        }
        
        function triggerEvents() {
            log('📡 Triggering events...', 'info');
            log('⚠️ Events only work in main app context', 'warning');
            log('📋 To trigger events in main app console:', 'info');
            log('window.dispatchEvent(new CustomEvent("database:check"))', 'info');
            log('window.dispatchEvent(new CustomEvent("livestore:init"))', 'info');
        }
        
        // Auto-run on page load
        log('🧪 LiveStore Initialization Debug Console Ready', 'success');
        log('Click "Run LiveStore Test" to get the debug script', 'info');
        log('', 'info');
    </script>
</body>
</html>
