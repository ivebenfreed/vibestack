<!DOCTYPE html>
<html>
<head>
    <title>Sync Test</title>
</head>
<body>
    <h1>Manual Sync Test</h1>
    <div id="status">Loading...</div>
    <button onclick="location.reload()">Reload Page</button>
    <pre id="log"></pre>
    
    <script>
        const log = (msg) => {
            const logEl = document.getElementById('log');
            logEl.textContent += new Date().toISOString() + ' - ' + msg + '\n';
            console.log(msg);
        };
        
        // Check localStorage for sync state
        const syncState = localStorage.getItem('syncMachineState');
        const lsn = localStorage.getItem('currentLSN');
        const clientId = localStorage.getItem('clientId');
        
        log('Current localStorage state:');
        log('  LSN: ' + lsn);
        log('  Client ID: ' + clientId);
        if (syncState) {
            const parsed = JSON.parse(syncState);
            log('  Sync state: ' + JSON.stringify(parsed.value));
        }
        
        // Open app in iframe to watch sync
        log('\nOpening app in iframe...');
        const iframe = document.createElement('iframe');
        iframe.src = 'http://localhost:5173';
        iframe.style.width = '100%';
        iframe.style.height = '600px';
        iframe.style.border = '1px solid #ccc';
        document.body.appendChild(iframe);
        
        // Listen for messages from iframe if any
        window.addEventListener('message', (e) => {
            if (e.origin === 'http://localhost:5173') {
                log('Message from app: ' + JSON.stringify(e.data));
            }
        });
        
        document.getElementById('status').textContent = 'Check server logs for sync strategy determination';
    </script>
</body>
</html>
