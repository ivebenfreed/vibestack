services:
  postgres:
    container_name: vibestack-main-postgres
    build:
      context: ..
      dockerfile: Dockerfile.postgres
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=3
      -c max_replication_slots=3
      -c max_logical_replication_workers=3
      -c log_statement=all
      -c log_replication_commands=on
      -c logging_collector=off
      -c log_destination=stderr
      -c log_min_messages=info
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - vibestack_main_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=vibestack_dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - main
    restart: unless-stopped

networks:
  main:
    driver: bridge
    name: vibestack-main-network

volumes:
  vibestack_main_postgres_data:
    external: true